<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            flex-shrink: 0;
        }
        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">OAuth2 Client App</a>
    </div>
</nav>

<div class="login-container">
    <div class="card shadow-lg" style="width: 400px;">
        <div class="card-body p-5">
            <h3 class="card-title text-center mb-4">Welcome</h3>
            <p class="text-center text-muted mb-4">Sign in with your account</p>
            <a href="/oauth2/authorization/demo-client" class="btn btn-primary w-100 btn-lg">
                Login with OAuth2
            </a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
