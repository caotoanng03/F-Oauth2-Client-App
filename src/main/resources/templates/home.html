<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/home">OAuth2 App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <div class="navbar-text text-white me-3" th:text="'Welcome, ' + ${username}"></div>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="/logout">Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">
  <div class="row">
    <div class="col-md-8 mx-auto">
      <div class="card mb-4">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0">User Information</h5>
        </div>
        <div class="card-body">
          <p><strong>Username:</strong> <span th:text="${username}"></span></p>
          <p><strong>Email:</strong> <span th:text="${email}"></span></p>
          <p><strong>Access Token:</strong> <span th:text="${accessToken}"></span></p>
          <p><strong>Refresh Token:</strong> <span th:text="${refreshToken}"></span></p>
          <p><strong>Role:</strong>
            <span class="badge bg-info me-2" th:text="${role}"></span>
          </p>

        </div>
      </div>

      <div class="card">
        <div class="card-header bg-dark text-white">
          <h5 class="mb-0">Actions</h5>
        </div>
        <div class="card-body">
          <div class="d-grid gap-2">
            <a href="http://localhost:8082/api/products" class="btn btn-outline-primary btn-lg">
              View All Products
            </a>
            <a th:if="${isAdmin}" href="/create-product" class="btn btn-outline-success btn-lg">
              Create New Product
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
